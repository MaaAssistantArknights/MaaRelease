name: update_qq_group_index

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 操作平台（默认 Windows）
        type: choice
        required: true
        default: windows
        options:
          - windows
          - android
          - mac
          - all
      mode:
        description: 推荐模式
        type: choice
        required: true
        default: auto
        options:
          - auto
          - manual
          - channel
      group_number:
        description: mode=manual 时的群编号（从 1 开始，对应该平台 content 文件行序）
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MaaAssistantArknights/api/qqgroup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # uses: 的路径相对仓库根，不受上面的 working-directory 影响
          package_json_file: MaaAssistantArknights/api/qqgroup/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 24 = 当前 LTS；顺带消除 v4 的 "Node.js 20 is deprecated" 警告
          node-version: "24"
          cache: pnpm
          cache-dependency-path: MaaAssistantArknights/api/qqgroup/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select recommend group
        env:
          GROUPINFO_API: https://join.maameow.com/api/groupinfo
          PLATFORM: ${{ github.event.inputs.platform }}
          MODE: ${{ github.event.inputs.mode }}
          GROUP_NUMBER: ${{ github.event.inputs.group_number }}
        run: |
          set -e
          PLATFORM="$(echo -n "$PLATFORM" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          MODE="$(echo -n "$MODE" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          GROUP_NUMBER="$(echo -n "$GROUP_NUMBER" | tr -d '[:space:]')"

          case "$PLATFORM" in
            windows|android|mac|all) ;;
            *)
              echo "invalid platform: $PLATFORM"
              exit 1
              ;;
          esac

          case "$MODE" in
            auto)
              pnpm run gen -- "$PLATFORM" auto
              ;;
            channel)
              pnpm run gen -- "$PLATFORM" channel
              ;;
            manual)
              if [ -z "$GROUP_NUMBER" ]; then
                echo "mode=manual 需要填写 group_number"
                exit 1
              fi
              if ! [[ "$GROUP_NUMBER" =~ ^[0-9]+$ ]]; then
                echo "group_number 必须是数字: $GROUP_NUMBER"
                exit 1
              fi
              if [ "$PLATFORM" = "all" ]; then
                echo "mode=manual 不能选 platform=all，请指定 windows/android/mac"
                exit 1
              fi
              pnpm run gen -- "$PLATFORM" "$GROUP_NUMBER"
              ;;
            *)
              echo "invalid mode: $MODE"
              exit 1
              ;;
          esac

      - name: Build index.html
        run: pnpm run build

      - name: Commit and push
        env:
          PLATFORM: ${{ github.event.inputs.platform }}
          MODE: ${{ github.event.inputs.mode }}
          GROUP_NUMBER: ${{ github.event.inputs.group_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/recommend.json index.html

          PLATFORM="$(echo -n "$PLATFORM" | tr -d '[:space:]')"
          MODE="$(echo -n "$MODE" | tr -d '[:space:]')"
          GROUP_NUMBER="$(echo -n "$GROUP_NUMBER" | tr -d '[:space:]')"

          case "$MODE" in
            auto)
              MSG="Update qqgroup recommend: sticky auto (${PLATFORM})"
              ;;
            channel)
              MSG="Update qqgroup recommend: QQ channel (${PLATFORM})"
              ;;
            manual)
              MSG="Update qqgroup recommend: ${PLATFORM} group ${GROUP_NUMBER} (manual)"
              ;;
            *)
              MSG="Update qqgroup recommend (${PLATFORM}/${MODE})"
              ;;
          esac

          if git diff --cached --quiet; then
            echo "recommend.json / index.html 无变化，无需提交"
            exit 0
          fi
          git commit -m "$MSG"
          git push
